name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  dmg:
    # macos-14 runner images were retired on 2026-11-02; macos-15 is the arm64 image to build on.
    runs-on: macos-15
    # A new repository issues a read-only GITHUB_TOKEN by default, which cannot create a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the SVG rasterizer the icon build needs
        run: brew install librsvg

      - name: Test
        run: swift test

      - name: Build and sign the app bundle
        run: bash Scripts/build.sh

      - name: Build the DMG
        run: bash Scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: battery-charge-limit
          path: dist/*.dmg

      - name: Attach the DMG to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
